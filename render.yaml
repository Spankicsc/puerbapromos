services:
  - type: web
    name: promospedia
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:push && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: promospedia-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: promospedia-db
    databaseName: promospedia
    plan: free
